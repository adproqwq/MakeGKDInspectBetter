name: stable_release
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Set up Nodejs
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: build
        run: |
          pnpm ci
          pnpm build

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./dist/miku-magic-wand.user.js
          body_path: ./changeLog.md
          prerelease: false
